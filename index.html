<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Inventory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%2358a6ff'/><path d='M7 8l10 4-10 4z' fill='%230d1117'/></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1a2332 0%, #0d1117 100%);
  padding: 16px 20px;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(90deg, #58a6ff, #bc8cff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-sub { font-size: 12px; color: #8b949e; }
.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: rgba(13, 17, 23, 0.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  z-index: 300;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
}
.bottom-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 4px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.55);
  cursor: pointer;
  border: none;
  background: none;
  font-family: inherit;
}
.bottom-tab .tab-icon { font-size: 19px; line-height: 1.1; }
.bottom-tab.active { color: #58a6ff; }
.bottom-tab.active .tab-icon { transform: scale(1.08); }
.content { padding: 20px 20px 84px; }
.page { display: none; }
.page.active { display: block; }
.search-box {
  display: flex;
  gap: 8px;
  align-items: center;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.search-box input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: #e6edf3;
  font-size: 16px;
  font-family: inherit;
}
.search-box svg { width: 18px; height: 18px; flex-shrink: 0; }
.cat-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.cat-btn {
  padding: 5px 12px;
  border-radius: 12px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid #30363d;
  background: transparent;
  color: #8b949e;
  font-family: inherit;
}
.cat-btn.active {
  background: linear-gradient(90deg, #58a6ff, #bc8cff);
  border-color: transparent;
  color: #000;
  font-weight: bold;
}
.result-meta { font-size: 12px; color: #8b949e; margin-bottom: 10px; }
.vgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 640px) { .vgrid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 960px) { .vgrid { grid-template-columns: repeat(4, 1fr); } }
.vcard {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
}
.vcard:active { transform: scale(0.98); }
.vposter {
  width: 100%;
  aspect-ratio: 3/4;
  background: #21262d center/cover no-repeat;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #484f58;
  font-size: 28px;
}
.vposter img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vbadges {
  position: absolute;
  top: 6px;
  left: 6px;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.vbadge {
  padding: 2px 7px;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 700;
  background: rgba(13, 17, 23, 0.85);
  color: #fff;
}
.vbadge.grade { background: rgba(188, 140, 255, 0.9); color: #0d1117; }
.vbadge.dbG { background: rgba(63, 185, 80, 0.9); color: #0d1117; }
.vbadge.dbGW { background: rgba(88, 166, 255, 0.9); color: #0d1117; }
.vbadge.dbY { background: rgba(255, 179, 0, 0.9); color: #0d1117; }
.vbadge.dbX { background: rgba(255, 107, 107, 0.9); color: #0d1117; }
.vbadge.dbN { background: rgba(139, 148, 158, 0.9); color: #0d1117; }
.vbody { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.vtitle {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.vmeta { font-size: 11px; color: #8b949e; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.vmeta .dot { opacity: 0.6; }
.vgpa { font-size: 13px; font-weight: 700; color: #58a6ff; }
.vchars { font-size: 11px; color: #8b949e; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { text-align: center; color: #8b949e; padding: 40px 0; font-size: 14px; }
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(13, 17, 23, 0.96);
  z-index: 400;
  overflow-y: auto;
  padding: 20px 20px 90px;
  display: none;
}
.overlay.open { display: block; }
.overlay-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.close-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid #30363d;
  background: #161b22;
  color: #e6edf3;
  font-size: 17px;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}
.det-hero { display: flex; gap: 14px; margin-bottom: 16px; }
.det-poster {
  width: 120px;
  height: 160px;
  flex-shrink: 0;
  border-radius: 10px;
  background: #21262d center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #484f58;
  font-size: 30px;
  overflow: hidden;
}
.det-poster img { width: 100%; height: 100%; object-fit: cover; }
.det-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.det-title { font-size: 17px; font-weight: 700; line-height: 1.35; }
.det-sub { font-size: 12px; color: #8b949e; }
.det-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.det-sec { margin-top: 12px; }
.det-sec h3 { font-size: 13px; color: #8b949e; margin-bottom: 8px; font-weight: 600; }
.det-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 14px;
  font-size: 13px;
}
.det-grid .k { color: #8b949e; }
.det-grid .v { color: #e6edf3; word-break: break-all; }
.char-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid #21262d;
  font-size: 13px;
}
.char-row:last-child { border-bottom: none; }
.char-name { font-weight: 600; }
.char-role { color: #58a6ff; font-size: 12px; margin-left: 6px; }
.char-actors { color: #8b949e; font-size: 12px; text-align: right; }
.det-links { display: flex; flex-direction: column; gap: 6px; }
.det-links a {
  color: #58a6ff;
  font-size: 13px;
  text-decoration: none;
  word-break: break-all;
}
.dl-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  padding: 10px;
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}
.dl-poster {
  width: 66px;
  height: 88px;
  flex-shrink: 0;
  border-radius: 8px;
  background: #21262d center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #484f58;
  font-size: 20px;
  overflow: hidden;
}
.dl-poster img { width: 100%; height: 100%; object-fit: cover; }
.dl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dl-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dl-name { font-size: 14px; font-weight: 600; }
.dl-tier {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 700;
}
.tier1 { background: rgba(188, 140, 255, 0.9); color: #0d1117; }
.tier2 { background: rgba(88, 166, 255, 0.9); color: #0d1117; }
.tier3 { background: rgba(139, 148, 158, 0.8); color: #0d1117; }
.dl-bar {
  height: 8px;
  background: #21262d;
  border-radius: 5px;
  overflow: hidden;
}
.dl-bar-fill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, #58a6ff, #bc8cff);
}
.dl-stat { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; }
.dl-note { font-size: 11px; color: #8b949e; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dl-links { display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
.dl-links a {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 8px;
  border: 1px solid #30363d;
  color: #58a6ff;
  text-decoration: none;
}
.dl-st {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 600;
}
.st-doing { background: rgba(88, 166, 255, 0.18); color: #58a6ff; }
.st-done { background: rgba(63, 185, 80, 0.18); color: #3fb950; }
.st-drop { background: rgba(139, 148, 158, 0.18); color: #8b949e; }
.filter-bar { display: flex; gap: 6px; padding: 0 0 12px; overflow-x: auto; flex-wrap: wrap; }
.filter-btn {
  padding: 5px 12px;
  border-radius: 12px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid #30363d;
  background: transparent;
  color: #8b949e;
  font-family: inherit;
}
.filter-btn.active {
  background: linear-gradient(90deg, #58a6ff, #bc8cff);
  border-color: transparent;
  color: #000;
  font-weight: bold;
}
.news-list { display: flex; flex-direction: column; gap: 10px; }
.news-card {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 12px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s;
}
.news-card:active { transform: scale(0.99); }
.news-thumb {
  width: 88px;
  height: 60px;
  flex-shrink: 0;
  border-radius: 8px;
  background: #21262d center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  overflow: hidden;
}
.news-thumb img { width: 100%; height: 100%; object-fit: cover; }
.news-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.news-title { font-size: 13px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #8b949e; }
.news-badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; background: rgba(88, 166, 255, 0.18); color: #58a6ff; }
.news-sum { font-size: 11px; color: #8b949e; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-stamp { font-size: 10px; color: #484f58; flex-shrink: 0; }
</style>
</head>
<body>
<header class="header">
  <h1>Video Inventory</h1>
  <div class="header-sub" id="updatedLabel"></div>
</header>

<div class="content">
  <div class="page active" id="page-search">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜尋影片／動畫／劇集名稱…" autocomplete="off">
    </div>
    <div class="cat-bar" id="catBar"></div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="vgrid" id="vgrid"></div>
  </div>

  <div class="page" id="page-dl">
    <div class="result-meta" id="dlMeta"></div>
    <div id="dlList"></div>
  </div>

  <div class="page" id="page-news">
    <div class="filter-bar" id="newsFilter"></div>
    <div class="news-list" id="newsList"></div>
  </div>

  <div class="page" id="page-watch">
    <div id="watchProgressSummary" style="margin-bottom:12px;"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
      <button onclick="watchUp()" style="padding:6px 12px;background:#21262d;border:1px solid #30363d;border-radius:8px;color:#e6edf3;cursor:pointer;font-family:inherit;font-size:13px;">&#8617; 上層</button>
      <div id="watchBreadcrumb" style="flex:1;font-size:13px;color:#8b949e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
    </div>
    <div id="watchList" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>
</div>

<div class="overlay" id="playerOverlay" style="z-index:500;">
  <div class="overlay-head">
    <button class="close-btn" onclick="closePlayer()">&times;</button>
    <span id="playerTitle" style="font-size:14px;color:#e6edf3;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    <button id="markWatchedBtn" onclick="markCurrentWatched()" style="display:none;padding:6px 14px;border-radius:8px;border:1px solid #3fb950;background:rgba(63,185,80,0.2);color:#3fb950;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap;">&#10003; 睇完這集</button>
  </div>
  <video id="playerVideo" controls crossorigin="anonymous" style="width:100%;border-radius:12px;background:#000;max-height:70vh;"></video>
</div>

<div class="overlay" id="detailOverlay">
  <div class="overlay-head">
    <button class="close-btn" id="closeDetail">&times;</button>
    <span style="font-size:14px;color:#8b949e;">影片詳細資料</span>
  </div>
  <div id="detailBody"></div>
</div>

<nav class="bottom-tabs">
  <button class="bottom-tab" data-tab="watch"><span class="tab-icon">&#127916;</span>Watching</button>
  <button class="bottom-tab" data-tab="dl"><span class="tab-icon">&#11015;&#65039;</span>下載中</button>
  <button class="bottom-tab" data-tab="news"><span class="tab-icon">&#128240;</span>新聞</button>
  <button class="bottom-tab active" data-tab="search"><span class="tab-icon">&#128269;</span>搜尋</button>
</nav>

<script>
const state = { videos: [], downloads: [], news: [], cat: '', q: '', ncat: '', progress: [], nasAll: [] };
const $ = (s) => document.querySelector(s);

function loadJSON(url) {
  return fetch(url, { cache: 'no-store' }).then(r => r.json()).catch(() => null);
}

Promise.all([loadJSON('videos.json'), loadJSON('downloads.json'), loadJSON('news-cache.json')]).then(([v, d, n]) => {
  state.videos = (v && v.videos) || [];
  state.downloads = (d && d.downloads) || [];
  state.news = (n && n.articles) || [];
  $('#updatedLabel').textContent = '影片 ' + state.videos.length + ' 部';
  buildCats();
  renderVideos();
  renderDl();
  renderNews();
}).catch(e => {
  $('#updatedLabel').textContent = '載入失敗';
  $('#vgrid').innerHTML = '<div class="empty">無法載入數據（請確認 JSON 已部署）</div>';
});

document.querySelectorAll('.bottom-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.bottom-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $('#page-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'dl') loadDlExtras();
    if (btn.dataset.tab === 'news') renderNews();
    if (btn.dataset.tab === 'watch') { if (!state.progress.length) loadDlExtras(); loadWatch(''); }
  });
});

const CATS = ['Animation', 'Drama', 'Movie', 'Advertisement', 'Information'];
function buildCats() {
  const counts = {};
  state.videos.forEach(v => { if (v.cat) counts[v.cat] = (counts[v.cat] || 0) + 1; });
  const bar = $('#catBar');
  bar.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'cat-btn active';
  all.textContent = '全部 (' + state.videos.length + ')';
  all.onclick = () => { state.cat = ''; resetCats(all); renderVideos(); };
  bar.appendChild(all);
  CATS.forEach(c => {
    const n = counts[c] || 0;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'cat-btn';
    b.textContent = c + ' (' + n + ')';
    b.dataset.cat = c;
    b.onclick = () => { state.cat = c; resetCats(b); renderVideos(); };
    bar.appendChild(b);
  });
}
function resetCats(active) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  active.classList.add('active');
}

function dbClass(db) {
  return { 'G': 'dbG', 'GW': 'dbGW', 'Y': 'dbY', 'Xunlei': 'dbX', 'N': 'dbN' }[db] || 'dbN';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function charsText(v) {
  if (!v.chars || !v.chars.length) return '';
  return v.chars.map(c => c.n + (c.a && c.a.length ? '（' + c.a.map(a => a.n).join('、') + '）' : '')).join('、');
}
function filtered() {
  const q = state.q.trim().toLowerCase();
  return state.videos.filter(v => {
    if (state.cat && v.cat !== state.cat) return false;
    if (!q) return true;
    const hay = [v.t, v.t2, v.ot, (v.chars || []).map(c => c.n).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
}
function renderVideos() {
  const q = state.q.trim();
  const list = filtered();
  $('#resultMeta').textContent = q ? ('「' + q + '」共 ' + list.length + ' 筆結果') : ('全部影片 ' + list.length + ' 部');
  const grid = $('#vgrid');
  if (!list.length) { grid.innerHTML = '<div class="empty">沒有符合的影片</div>'; return; }
  grid.innerHTML = list.map(v => {
    const chars = charsText(v);
    return '<div class="vcard" onclick="openDetail(\'' + v.id + '\')">' +
      '<div class="vposter">' +
      (v.p ? '<img src="' + v.p + '" loading="lazy" alt="" onerror="this.style.display=\'none\'">' : '&#127916;') +
      '<div class="vbadges">' +
      (v.g ? '<span class="vbadge grade">' + esc(v.g) + '</span>' : '') +
      (v.gpa ? '<span class="vbadge">' + v.gpa.toFixed(2) + '</span>' : '') +
      (v.db ? '<span class="vbadge ' + dbClass(v.db) + '">' + esc(v.db) + '</span>' : '') +
      '</div></div>' +
      '<div class="vbody">' +
      '<div class="vtitle">' + esc(v.t) + '</div>' +
      '<div class="vmeta">' +
      (v.cat ? '<span>' + esc(v.cat) + '</span>' : '') +
      (v.yr ? '<span class="dot">·</span><span>' + v.yr + '</span>' : '') +
      (v.loc ? '<span class="dot">·</span><span>' + esc(v.loc) + '</span>' : '') +
      (v.res ? '<span class="dot">·</span><span>' + esc(v.res) + '</span>' : '') +
      '</div>' +
      (chars ? '<div class="vchars">' + esc(chars) + '</div>' : '') +
      '</div></div>';
  }).join('');
}
$('#searchInput').addEventListener('input', e => {
  state.q = e.target.value;
  renderVideos();
});

function openDetail(id) {
  const v = state.videos.find(x => x.id === id);
  if (!v) return;
  const parts = [];
  parts.push('<div class="det-hero">' +
    '<div class="det-poster">' + (v.p ? '<img src="' + v.p + '" alt="">' : '&#127916;') + '</div>' +
    '<div class="det-info">' +
    '<div class="det-title">' + esc(v.t) + '</div>' +
    (v.t2 || v.ot ? '<div class="det-sub">' + esc(v.t2 || '') + (v.t2 && v.ot ? ' ／ ' : '') + esc(v.ot || '') + '</div>' : '') +
    '<div class="det-badges">' +
    (v.g ? '<span class="vbadge grade">' + esc(v.g) + '</span>' : '') +
    (v.gpa ? '<span class="vbadge" style="background:rgba(88,166,255,.85)">GPA ' + v.gpa.toFixed(2) + '</span>' : '') +
    (v.db ? '<span class="vbadge ' + dbClass(v.db) + '">DB: ' + esc(v.db) + '</span>' : '') +
    '</div>' +
    '<div class="vmeta">' + [v.cat, v.sub, v.type, v.sea, v.yr, v.loc, v.lang].filter(Boolean).join(' · ') + '</div>' +
    '</div></div>');
  const kv = [
    ['分類', v.cat], ['類型', v.type], ['季', v.sea], ['年份', v.yr], ['地區', v.loc], ['語言', v.lang],

function stClass(st) {
  return st === '進行中' ? 'st-doing' : st === '已完成' ? 'st-done' : 'st-drop';
}
function mdUrl(s) {
  const m = String(s == null ? '' : s).match(/\(([^)]+)\)\s*$/);
  return m ? m[1] : s;
}

function loadDlExtras() {
  Promise.all([

function findProgress(name) {
  return state.progress.find(p => p.name && name.includes(p.name)) || null;
}
function findNas(name) {
  if (!state.nasAll) return null;
  const n = name.toLowerCase();
  return state.nasAll.find(f => {
    const fn = f.name.toLowerCase();
    return n.includes(fn) || fn.includes(n);
  }) || null;
}

function fmtSize(bytes) {
  if (bytes > 1073741824) return (bytes/1073741824).toFixed(1) + ' GB';

  return (bytes/1024).toFixed(0) + ' KB';
}

    html += '<span>' + watched + ' / ' + downloaded + ' / ' + released + ' / ' + total + '</span>';
    html += '</div>';

function playVideo(path, name) {
  $('#playerTitle').textContent = name;
  const v = $('#playerVideo');
  v.querySelectorAll('track').forEach(t => t.remove());
  v.crossOrigin = 'anonymous';
  v.src = PROXY + '/proxy?path=' + encodeURIComponent(path);
  const srtPath = path.replace(/\.(mp4|mkv)$/i, '.srt');
  const track = document.createElement('track');
  track.kind = 'subtitles';
  track.label = '中文';
  track.srclang = 'zh';
  track.onload = function() {
    if (v.textTracks.length > 0) v.textTracks[0].mode = 'showing';
  };
  track.src = PROXY + '/proxy?path=' + encodeURIComponent(srtPath);
  v.appendChild(track);
  $('#playerOverlay').classList.add('open');
  v.load();
  v.play().catch(() => {});
  setTimeout(() => { if (v.textTracks.length > 0) v.textTracks[0].mode = 'showing'; }, 500);

  let lastClick = 0, lastClickX = 0;
  let dragStartX = 0, dragStartTime = 0, dragging = false;

  v.addEventListener('dblclick', function(e) {
    const rect = v.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x > rect.width * 0.6) { v.currentTime += 10; flashSeek('+10s'); }
    else if (x < rect.width * 0.4) { v.currentTime -= 10; flashSeek('-10s'); }
  });

  v.ontouchend = function(e) {
    const now = Date.now();
    const touch = e.changedTouches[0];
    const rect = v.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    if (now - lastClick < 300 && Math.abs(x - lastClickX) < 50) {
      if (x > rect.width * 0.6) { v.currentTime += 10; flashSeek('+10s'); }
      else if (x < rect.width * 0.4) { v.currentTime -= 10; flashSeek('-10s'); }
      lastClick = 0;
    } else {
      lastClick = now; lastClickX = x;
    }
  };
  v.ontouchstart = function(e) {
    const touch = e.touches[0];
    const rect = v.getBoundingClientRect();
    dragStartX = touch.clientX - rect.left;
    dragStartTime = v.currentTime;
    dragging = true;
  };
  v.ontouchmove = function(e) {
    if (!dragging) return;
    const touch = e.touches[0];
    const rect = v.getBoundingClientRect();
    const dx = (touch.clientX - rect.left) - dragStartX;
    if (v.duration) {
      v.currentTime = Math.max(0, Math.min(v.duration, dragStartTime + dx * 0.6));
      showSeekPreview(v.currentTime, v.duration);
    }
  };
  v.ontouchend = function() { dragging = false; hideSeekPreview(); };

  v.onmousedown = function(e) {
    if (e.target !== v) return;
    const rect = v.getBoundingClientRect();
    dragStartX = e.clientX - rect.left;
    dragStartTime = v.currentTime;
    dragging = true;
  };
  window.onmousemove = function(e) {
    if (!dragging) return;
    const rect = v.getBoundingClientRect();
    const dx = e.clientX - rect.left - dragStartX;
    if (v.duration) {
      v.currentTime = Math.max(0, Math.min(v.duration, dragStartTime + dx * 0.6));
      showSeekPreview(v.currentTime, v.duration);
    }
  };
  window.onmouseup = function() { if (dragging) { dragging = false; hideSeekPreview(); } };

  function flashSeek(txt) {
    let el = document.getElementById('seekFlash');
    if (!el) {
      el = document.createElement('div');
      el.id = 'seekFlash';
      el.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:10px 20px;border-radius:8px;font-size:18px;font-weight:700;z-index:600;pointer-events:none;';
      $('#playerOverlay').appendChild(el);
    }
    el.textContent = txt;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.style.display = 'none', 600);
  }
  function showSeekPreview(cur, dur) {
    let el = document.getElementById('seekFlash');
    if (!el) {
      el = document.createElement('div');
      el.id = 'seekFlash';
      el.style.cssText = 'position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:6px 14px;border-radius:8px;font-size:14px;z-index:600;pointer-events:none;';
      $('#playerOverlay').appendChild(el);
    }
    const m = Math.floor(cur/60), s = Math.floor(cur%60);
    el.textContent = m + ':' + (s<10?'0':'') + s + ' / ' + Math.floor(dur/60) + ':' + (Math.floor(dur%60)<10?'0':'') + Math.floor(dur%60);
    el.style.display = 'block';
  }
  function hideSeekPreview() {
    const el = document.getElementById('seekFlash');
    if (el) { clearTimeout(el._t); el._t = setTimeout(() => el.style.display='none', 400); }
  }

  let epNum = null;
  const patterns = [
    /總第\s*(\d{1,4})/,
    /\[(\d{1,4})\]/,
    /EP\s*(\d{1,4})/i,
    /第(\d{1,4})[话話集]/,
    /[Ss]\d+\s*[-_]\s*(\d{1,4})/,
    /^(\d{1,3})[-_]/
  ];
  for (const re of patterns) {
    const m = name.match(re);
    if (m) {
      const n = parseInt(m[1]);
      if (n < 1900 || n > 2100) { epNum = n; break; }
    }
  }

  const doMatch = () => {
    const folderName = watchPath.split('/').pop();
    let match = state.progress.find(p => p.name && (
      folderName.includes(p.name) || p.name.includes(folderName)
    ));
    if (!match) {
      match = state.progress.find(p => p.name && name.includes(p.name));
    }
    const btn = $('#markWatchedBtn');
    state.currentEp = epNum;
    if (match && epNum) {
      state.currentRec = match;
      btn.style.display = 'inline-block';
      btn.style.background = 'rgba(255,179,0,0.15)';
      btn.style.borderColor = '#ffb300';
      btn.style.color = '#ffb300';
      btn.textContent = '✓ 標記已看 E' + epNum;
    } else if (match && !epNum) {
      state.currentRec = match;
      btn.style.display = 'inline-block';
      btn.style.background = 'rgba(255,179,0,0.15)';
      btn.style.borderColor = '#ffb300';
      btn.style.color = '#ffb300';
      btn.textContent = '✓ 標記已看';
    } else {
      state.currentRec = null;
      btn.style.display = 'none';
    }
  };
  if (!state.progress.length) {
    fetch(PROXY + '/progress').then(r => r.json()).then(d => {
      state.progress = d.records || [];
      doMatch();
    });
  } else {
    doMatch();
  }
}

      btn.style.borderColor = '#f85149';
      btn.style.color = '#f85149';
      btn.textContent = '✗ 失敗，再試';
    });
}

function closePlayer() {
  const v = $('#playerVideo');
  v.pause();
  v.src = '';
  $('#playerOverlay').classList.remove('open');
}
</script>
